name: Windows quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LLM_BACKEND: heuristic
      EMBED_BACKEND: hash
      SEARCH_ENABLED: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/windows-constraints.txt
      - name: Install using the documented setup
        run: ./scripts/setup_windows.ps1 -Development
      - name: Run the test suite
        run: .venv/Scripts/python.exe -m pytest -q
      - name: Build and install the distributable wheel
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pip wheel --no-deps --wheel-dir build/wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem build/wheels/markov_engine-*.whl | Select-Object -First 1
          .venv/Scripts/python.exe -m pip install --force-reinstall --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip check
      - name: Check installed assets, processing, and restart persistence
        run: .venv/Scripts/python.exe scripts/smoke_service.py
