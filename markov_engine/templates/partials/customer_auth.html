{% if request is defined and request.state.clerk_config|default(none) %}
  {% set clerk = request.state.clerk_config %}
  <script defer crossorigin="anonymous"
    src="{{ clerk.frontend_api }}/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script defer crossorigin="anonymous" data-clerk-publishable-key="{{ clerk.publishable_key }}"
    src="{{ clerk.frontend_api }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
  <script defer src="/static/customer-auth.js?v=clerk-1"></script>
{% endif %}
