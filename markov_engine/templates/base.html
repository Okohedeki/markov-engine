<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fcfbf8">
  <meta name="description" content="{% block description %}Markov turns a source or question into an evidence-linked research path and finished factual work.{% endblock %}">
  {% block meta %}{% endblock %}
  <title>{% block title %}Markov{% endblock %}</title>
  <link rel="icon" href="{{ site_base }}/static/markov-mark.svg" type="image/svg+xml">
  {% block styles %}<link rel="stylesheet" href="{{ site_base }}/static/markov.css">{% endblock %}
  <script defer src="{{ site_base }}/static/markov.js"></script>
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="mk-skip" href="#main-content">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
