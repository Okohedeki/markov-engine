<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#171b24">
  <meta name="description" content="{% block description %}Turn the conversations around you into more posting ideas. Explore different angles, collect your favorites, and develop a draft with Markov.{% endblock %}">
  {% block meta %}{% endblock %}
  <title>{% block title %}Markov{% endblock %}</title>
  <link rel="icon" href="{{ site_base }}/static/markov-mark.svg" type="image/svg+xml">
  <link rel="preload" href="{{ site_base }}/static/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  {% block styles %}<link rel="stylesheet" href="{{ site_base }}/static/studio.css"><link rel="stylesheet" href="{{ site_base }}/static/workspace.css"><link rel="stylesheet" href="{{ site_base }}/static/account.css">{% endblock %}
  <link rel="stylesheet" href="{{ site_base }}/static/public-info.css">
  <script defer src="{{ site_base }}/static/markov.js"></script>
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="mk-skip" href="#main-content">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
