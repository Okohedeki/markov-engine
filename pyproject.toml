[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markov-engine"
version = "1.0.0"
description = "An intelligent bookmark app with a personal processing engine and paired phone interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "markov-engine contributors" }]
keywords = ["bookmarks", "local-first", "pwa", "knowledge", "search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic",
    "voyageai",
    "trafilatura",
    "lxml-html-clean>=0.4,<1",  # Required by jusText; recent lxml versions split it out.
    "yt-dlp",
    "pymupdf",
    "faster-whisper",
    "ctranslate2>=4.8.2,<5",  # Avoid the removed pkg_resources runtime dependency.
    "soundfile",
    "ddgs",
    "httpx",
    "clerk-backend-api>=7.0.0,<8",
    "pydantic",
    "pydantic-settings",
    "aiosqlite",
    "fastapi",
    "jinja2>=3.1",
    "uvicorn",
    "qrcode>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==1.3.0"]
# Run a model in-process from a GGUF file (LLM_BACKEND=llamacpp / EMBED_BACKEND=llamacpp).
local = ["llama-cpp-python"]

[project.urls]
Homepage = "https://github.com/Okohedeki/markov-engine"
Source = "https://github.com/Okohedeki/markov-engine"

[project.scripts]
markov = "markov_engine.cli:main"
markov-api = "markov_engine.api:main"
markov-service = "markov_engine.service:main"

[tool.hatch.build.targets.wheel]
packages = ["markov_engine"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
